# Classification SPARQL endpoints served by classif-mcp.
# Add a national node by adding a block. "uri_prefixes" lets the server
# route a concept URI to the endpoint that publishes it.

[endpoints.caliper]
label = "Caliper (FAO) - UN and FAO statistical classifications (ISIC, CPC, ...)"
level = "world"
url = "https://caliper.integratedmodelling.org/caliper/sparql/"
uri_prefixes = [
  "https://unstats.un.org/classifications/",
  "https://stats.fao.org/classifications/",
  "http://unstats.un.org/classifications/",
]

[endpoints.insee]
label = "INSEE RDF - French national classifications (NAF, CPF, ...)"
level = "national"
country = "FR"
url = "https://rdf.insee.fr/sparql"
uri_prefixes = ["http://id.insee.fr/"]

# UNSD classifications not available as linked data (ISIC Rev. 5, CPC Ver. 3.0,
# ISIC Rev. 4 -> Rev. 5, ...). Convert the UNSD CSV/Excel files once with
# `classif-unsd` (see README), list the Turtle files here; they are served
# in memory with the same tools. Missing files are skipped.
[endpoints.unsd]
type = "local"
label = "UNSD files converted to SKOS/XKOS (ISIC Rev. 5, CPC Ver. 3.0, correspondences)"
level = "world"
provenance = "converted from a UNSD file (not official linked data; see dct:source)"
files =["data/isic-rev5.ttl", "data/cpc-v3.ttl", "data/isic4-isic5.ttl"]
uri_prefixes = ["http://classif-mcp.local/unsd/"]

# Optional: the EU layer. Already reachable through the EUR-Lex Cellar MCP;
# enable it here if you want the same tools on all three levels.
[endpoints.cellar]
enabled = false
label = "EU Vocabularies / Cellar - Eurostat classifications (NACE, CPA, PRODCOM, CN, HS)"
level = "eu"
url = "https://publications.europa.eu/webapi/rdf/sparql"
uri_prefixes = ["http://data.europa.eu/"]
