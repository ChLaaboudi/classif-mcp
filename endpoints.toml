# classif-mcp endpoints: the integrated system of economic classifications
# (NACE Rev. 2.1 methodology, section 1.1, Figure 1):
#   world     ISIC, CPC, HS, SITC
#   EU        NACE, CPA, PRODCOM, CN
#   national  national versions (here: NAF, CPF, EAP and EMB for France, NOGA 2025 for Switzerland)
#
# Tiers:
#   tier 1  type = "sparql" (default)  published RDF, queried live
#   tier 2  type = "file"              publisher's CSV/Excel/JSON, fetched and converted live
#   tier 3  type = "local"             transcribed from a PDF with classif-pdf (none configured)
#
# "schemes" restricts a SPARQL endpoint to the listed classifications: searches,
# scheme lists and links outside them are not returned. Previous versions are kept
# where they carry the published links between generations (NACE Rev. 2, CPA 2.1,
# NAF rev. 2): NACE Rev. 2.1 -> NACE Rev. 2 -> ISIC Rev. 4 -> ISIC Rev. 5.
# "uri_prefixes" route a concept URI to the endpoint that publishes it.
# SPARQL URLs are given WITHOUT a trailing slash (the slash form is the web UI).
# Verified 2026-10-26.

# ---------------------------------------------------------------- world, tier 1

[endpoints.caliper]
label = "Caliper (FAO) - ISIC Rev. 4, CPC Ver. 2.1 and 2.0"
level = "world"
url = "https://caliper.integratedmodelling.org/caliper/sparql"
uri_prefixes = ["https://unstats.un.org/classifications/", "http://unstats.un.org/classifications/"]
schemes = [
  "https://unstats.un.org/classifications/ISIC/rev4/scheme",
  "https://unstats.un.org/classifications/CPC/v2.1/core",
  "https://unstats.un.org/classifications/CPC/v2.0/scheme",
]

# ---------------------------------------------------------------- world, tier 2 (live)

# UNSD files fetched from unstats.un.org and converted in memory. The server asks
# UNSD whether a file changed (ETag) every refresh_hours; a new version is used
# only if it passes the checks (required_columns, min_items, max_change).
# Otherwise the last good copy is kept, then the cache, then the fallback file.
# HS is not here: HS 2022 and HS 2017 are published as RDF in Cellar (tier 1).
# Correspondence tables of the integrated system (UNSD diagram), most recent versions:
#   ISIC Rev. 4 - CPC 2.1   NOT here: Caliper publishes it as linked data (tier 1),
#                           same 2,663 pairs as UNSD's isic4-cpc21.txt
#   ISIC Rev. 4 - Rev. 5    below
#   CPC 2.1 - HS 2017       below; targets Cellar's HS 2017 items
#   HS 2022 - HS 2017       below; bridges the CPC table (HS 2017) to the SITC table (HS 2022)
#   HS 2022 - SITC Rev. 4   below; sources Cellar's HS 2022 items
# A Cellar HS item is the CN item of the same code: {code} + "000080" under the CN graph.
[endpoints.unsd]
type = "file"
label = "UNSD files, converted live (ISIC Rev. 5, CPC Ver. 3.0, SITC Rev. 4, CSA 2.0, and correspondence tables)"
level = "world"
provenance = "converted live from the UNSD file (not official linked data; see dct:source)"
refresh_hours = 24
uri_prefixes = ["http://classif-mcp.local/unsd/isic", "http://classif-mcp.local/unsd/cpc",
                "http://classif-mcp.local/unsd/csa",
                "http://classif-mcp.local/unsd/sitc", "http://classif-mcp.local/unsd/correspondence/"]

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/ISIC_Rev_5_english_structure.csv"
id = "isic-rev5"
label = "ISIC Rev. 5"
required_columns = ["ISIC Rev 5 Code", "ISIC Rev 5 Title"]
min_items = 800
fallback = "data/isic-rev5.ttl"

# Explanatory notes of ISIC Rev. 5, from a separate UNSD file, attached to the items above.
# The file prefixes codes with their section letter (A0111): strip_section removes it.
# Its "Notes" sheet says the notes were endorsed with ISIC Rev. 5 (UN Statistical Commission,
# 55th session, 2024) and updated on 19 August 2026 to clarify scope boundaries and correct
# typographical errors; the publication is a pre-edited version.
[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/ISIC5_Exp_Notes_19_Aug_2026.xlsx"
id = "isic-rev5-notes"
label = "ISIC Rev. 5 explanatory notes (UNSD, updated 19 August 2026)"
mode = "notes"
scheme_id = "isic-rev5"
sheet = "ISIC5"
code_col = "ISIC Rev 5 Code (with Section)"
strip_section = true
notes = { "ISIC Rev 5 Introductory Text" = "intro", "ISIC Rev 5 Includes" = "core", "ISIC Rev 5 Includes Also" = "additional", "ISIC Rev 5 Excludes" = "exclusion" }
required_columns = ["ISIC Rev 5 Code (with Section)", "ISIC Rev 5 Includes", "ISIC Rev 5 Excludes"]
min_items = 800
prov_note = "Explanatory notes as updated by UNSD on 19 August 2026 (pre-edited version of the ISIC Rev. 5 publication). Converted by classif-mcp; check against the source file."
fallback = "data/isic-rev5-notes.ttl"

# Classification of Statistical Activities, CSA 2.0 (endorsed by the UN Statistical
# Commission, 54th session, 2023; custodian UNSD). Not part of the integrated system of
# economic classifications: added on request. Domains are published as "Domain 1" ...
# "Domain 7"; key_regex keeps the digit for the URI (.../csa2/1), the code stays as notation.
[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/CSA2/CSA2_Structure.xlsx"
id = "csa2"
label = "CSA 2.0"
code_col = "Code"
label_col = "Title"
key_regex = "^(?:Domain\\s*)?(\\S+)$"
required_columns = ["Code", "Title"]
min_items = 100
fallback = "data/csa2.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/CSA2/CSA2_Exp_Notes.xlsx"
id = "csa2-notes"
label = "CSA 2.0 explanatory notes (UNSD)"
mode = "notes"
scheme_id = "csa2"
code_col = "Code"
key_regex = "^(?:Domain\\s*)?(\\S+)$"
notes = { "Coverage" = "core", "Exclusions" = "exclusion" }
required_columns = ["Code", "Coverage", "Exclusions"]
min_items = 100
prov_note = "Explanatory notes of CSA 2.0 as published by UNSD. Converted by classif-mcp; check against the source file."
fallback = "data/csa2-notes.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
id = "cpc-v3"
label = "CPC Ver. 3.0"
required_columns = ["CPC Ver. 3.0  Code", "CPC Ver. 3.0 Title"]
min_items = 4500
fallback = "data/cpc-v3.ttl"

# Known source anomaly: the SITC Rev. 4 sheet names divisions 09, 28 and 91 as
# parents but does not contain them; those 12 items stay at the top level, as published.
[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/SITCCodeandDescription.xlsx"
sheet = "SITC4"
id = "sitc-rev4"
label = "SITC Rev. 4"
code_col = "Code"
label_col = "Description"
parent_col = "Parent Code"
skip_codes = "TOTAL"
required_columns = ["Code", "Description", "Parent Code"]
min_items = 3900
fallback = "data/sitc-rev4.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/tables/ISIC/ISIC_Rev4_to_ISIC_Rev5_Correspondence_Table-17Jan2025.xlsx"
mode = "correspondence"
id = "isic4-isic5"
label = "ISIC Rev. 4 - ISIC Rev. 5"
source_col = "ISIC Rev. 4 Code"
target_col = "ISIC Rev. 5 Code"
note_col = "Type of change in GSIM (blank means no change)"
source_base = "https://unstats.un.org/classifications/ISIC/rev4/"
target_base = "http://classif-mcp.local/unsd/isic-rev5/"
required_columns = ["ISIC Rev. 4 Code", "ISIC Rev. 5 Code"]
min_items = 600
fallback = "data/isic4-isic5.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/tables/CPC/CPCv21_HS2017/CPC21-HS2017.csv"
mode = "correspondence"
id = "cpc21-hs2017"
label = "CPC Ver. 2.1 - HS 2017"
source_col = "CPC Ver. 2.1"
target_col = "HS 2017"
note_col = "CPC partial,HS partial"
source_base = "https://unstats.un.org/classifications/CPC/v2.1/"
target_base = "http://data.europa.eu/xsp/cn2017/"
target_suffix = "000080"
required_columns = ["CPC Ver. 2.1", "HS 2017", "CPC partial", "HS partial"]
min_items = 5500
fallback = "data/cpc21-hs2017.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/tables/HS2022toHS2017ConversionAndCorrelationTables.xlsx"
mode = "correspondence"
sheet = "HS2022-HS2017 Correlations"
header_row = 2
id = "hs2022-hs2017"
label = "HS 2022 - HS 2017"
source_col = "HS2022"
target_col = "HS2017"
note_col = "Relationship"
source_base = "http://data.europa.eu/xsp/cn2026/"
source_suffix = "000080"
target_base = "http://data.europa.eu/xsp/cn2017/"
target_suffix = "000080"
required_columns = ["HS2022", "HS2017", "Relationship"]
min_items = 15000
fallback = "data/hs2022-hs2017.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/tables/HS2022toSITC4ConversionAndCorrelationTables.xlsx"
mode = "correspondence"
sheet = "Correlation HS22-SITC4"
header_row = 2
id = "hs2022-sitc4"
label = "HS 2022 - SITC Rev. 4"
source_col = "HS 2022"
target_col = "SITC Rev. 4"
note_col = "Relationship"
source_base = "http://data.europa.eu/xsp/cn2026/"
source_suffix = "000080"
target_base = "http://classif-mcp.local/unsd/sitc-rev4/"
required_columns = ["HS 2022", "SITC Rev. 4", "Relationship"]
min_items = 12500
fallback = "data/hs2022-sitc4.ttl"

# ---------------------------------------------------------------- EU, tier 1

[endpoints.cellar]
label = "Cellar (EU Vocabularies) - NACE, CPA, PRODCOM, CN and HS"
level = "eu"
url = "https://publications.europa.eu/webapi/rdf/sparql"
uri_prefixes = ["http://data.europa.eu/"]
schemes = [
  "http://data.europa.eu/ux2/nace2.1/nace2.1",
  "http://data.europa.eu/ux2/nace2/nace2",
  "http://data.europa.eu/ehl/cpa22/cpa22",
  "http://data.europa.eu/ehl/cpa21/cpa21",
  "http://data.europa.eu/qw1/prodcom2026/prodcom2026",
  # HS before CN: an HS subheading is also a CN item and is reported in the first listed scheme
  "http://data.europa.eu/xsp/cn2026/hs2022",
  "http://data.europa.eu/xsp/cn2017/hs2017",
  "http://data.europa.eu/xsp/cn2026/cn2026",
]

# ---------------------------------------------------------------- national, tier 1

# EAP and EMB are INSEE's national product lists for production surveys (the French
# counterparts of PRODCOM): EAP = annual production survey, EMB = monthly branch surveys.
# Their items use non-http identifiers ("eap:produit/3092120000", "emb:produit/...");
# the server accepts and routes them, but they cannot be dereferenced on the web.
# EAP and EMB publish no link to PRODCOM; EAP codes extend PRODCOM codes by 2 digits,
# so EAP <-> PRODCOM is derived (match_by_code). EMB items carry published links
# (skos:relatedMatch) to NAF 2025.
[endpoints.insee]
# labels and notes in French unless another language is asked for
default_lang = "fr"
label = "INSEE - NAF 2025, NAF rev. 2, CPF rev. 2.1, EAP 2025 and EMB 2026 (France)"
level = "national"
country = "FR"
url = "https://rdf.insee.fr/sparql"
uri_prefixes = ["http://id.insee.fr/", "eap:", "emb:"]
schemes = [
  "http://id.insee.fr/codes/naf2025/naf",
  "http://id.insee.fr/codes/nafr2/naf",
  "http://id.insee.fr/codes/cpfr21/cpf",
  "http://id.insee.fr/codes/eap2025/eap",
  "http://id.insee.fr/codes/emb2026/emb",
]

# ---------------------------------------------------------------- national, tier 2 (live)

# NOGA 2025 (Switzerland), from the FSO's code list on I14Y, the Swiss interoperability
# platform: CSV export with an explicit ParentCode column, labels in de/fr/it/en and
# includes / includes-also / excludes notes, written here as XKOS notes per language.
# NOGA 2025 is identical to NACE Rev. 2.1 down to the class (4 digits) and adds Swiss
# 6-digit types; I14Y publishes no link to NACE, so NOGA -> NACE is derived (match_by_code).
# The URL names one version of the code list (nogaCode 2.0.1, valid from 2026-03-06);
# when the FSO publishes a new version on I14Y, replace the concept id below.
[endpoints.i14y]
type = "file"
label = "I14Y (FSO) - NOGA 2025, converted live (Switzerland)"
level = "national"
country = "CH"
provenance = "converted live from the FSO code list on I14Y (not linked data; see dct:source)"
refresh_hours = 24
uri_prefixes = ["http://classif-mcp.local/i14y/"]

[[endpoints.i14y.sources]]
url = "https://api.i14y.admin.ch/api/public/v1/concepts/001bfaa8-fa57-4d66-acfd-c795d67fcf80/codelist-entries/exports/csv"
format = ".csv"
id = "noga2025"
label = "NOGA 2025"
base = "http://classif-mcp.local/i14y/"
code_col = "Code"
label_col = "Name_en"
parent_col = "ParentCode"
labels = "Name_en=en,Name_fr=fr,Name_de=de,Name_it=it"
notes = """Description_en=core@en,Description_fr=core@fr,Description_de=core@de,Description_it=core@it,\
Annotation_INCLUDES_Text_en=inclusion@en,Annotation_INCLUDES_Text_fr=inclusion@fr,\
Annotation_INCLUDES_Text_de=inclusion@de,Annotation_INCLUDES_Text_it=inclusion@it,\
Annotation_INCLUDES_ALSO_Text_en=additional@en,Annotation_INCLUDES_ALSO_Text_fr=additional@fr,\
Annotation_INCLUDES_ALSO_Text_de=additional@de,Annotation_INCLUDES_ALSO_Text_it=additional@it,\
Annotation_EXCLUDES_Text_en=exclusion@en,Annotation_EXCLUDES_Text_fr=exclusion@fr,\
Annotation_EXCLUDES_Text_de=exclusion@de,Annotation_EXCLUDES_Text_it=exclusion@it"""
required_columns = ["Code", "ParentCode", "Name_en", "Name_fr", "Name_de"]
min_items = 1800
fallback = "data/noga2025.ttl"
