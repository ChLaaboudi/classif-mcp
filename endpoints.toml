# Classification endpoints served by classif-mcp, by tier:
#   tier 1  type = "sparql" (default)  published RDF, queried live
#   tier 2  type = "file"              publisher's CSV/Excel/JSON, fetched and converted live
#           type = "local"             a converted copy kept on disk
#   tier 3  type = "local"             transcribed from a PDF (classif-pdf), with
#                                      check_source = true to watch the PDF for changes
# "uri_prefixes" lets the server route a concept URI to the endpoint that publishes it.
# SPARQL URLs are given WITHOUT a trailing slash: on Caliper and INSEE the
# trailing-slash form serves the web query UI, not the API. Verified 2026-10-23.

# ---------------------------------------------------------------- tier 1

[endpoints.caliper]
label = "Caliper (FAO) - ISIC Rev. 4, CPC v2.0/v2.1, COICOP 1999, FAO classifications"
level = "world"
url = "https://caliper.integratedmodelling.org/caliper/sparql"
uri_prefixes = [
  "https://unstats.un.org/classifications/",
  "http://unstats.un.org/classifications/",
  "https://stats.fao.org/classifications/",
]

[endpoints.cellar]
label = "EU Vocabularies / Cellar - Eurostat classifications (NACE, CPA, PRODCOM, CN, HS)"
level = "eu"
url = "https://publications.europa.eu/webapi/rdf/sparql"
uri_prefixes = ["http://data.europa.eu/"]

[endpoints.insee]
label = "INSEE RDF - French national classifications (NAF 2025, NAF rev. 2, CPF, ...)"
level = "national"
country = "FR"
url = "https://rdf.insee.fr/sparql"
uri_prefixes = ["http://id.insee.fr/"]

# ---------------------------------------------------------------- tier 2, live

# UNSD files fetched from unstats.un.org and converted in memory. The server asks
# UNSD whether a file changed (ETag) every refresh_hours; a new version is used
# only if it passes the checks (required_columns, min_items, max_change).
# Otherwise the last good copy is kept, then the cache, then the fallback file.
[endpoints.unsd]
type = "file"
label = "UNSD files, converted live (ISIC Rev. 5, CPC Ver. 3.0, ISIC Rev. 4 - Rev. 5)"
level = "world"
provenance = "converted live from the UNSD file (not official linked data; see dct:source)"
refresh_hours = 24
uri_prefixes = ["http://classif-mcp.local/unsd/isic", "http://classif-mcp.local/unsd/cpc",
                "http://classif-mcp.local/unsd/correspondence/isic"]

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/ISIC_Rev_5_english_structure.csv"
id = "isic-rev5"
label = "ISIC Rev. 5"
required_columns = ["ISIC Rev 5 Code", "ISIC Rev 5 Title"]
min_items = 800
fallback = "data/isic-rev5.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
id = "cpc-v3"
label = "CPC Ver. 3.0"
required_columns = ["CPC Ver. 3.0  Code", "CPC Ver. 3.0 Title"]
min_items = 4500
fallback = "data/cpc-v3.ttl"

[[endpoints.unsd.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/tables/ISIC/ISIC_Rev4_to_ISIC_Rev5_Correspondence_Table-17Jan2025.xlsx"
mode = "correspondence"
id = "isic4-isic5"
label = "ISIC Rev. 4 - ISIC Rev. 5"
source_col = "ISIC Rev. 4 Code"
target_col = "ISIC Rev. 5 Code"
note_col = "Type of change in GSIM (blank means no change)"
source_base = "https://unstats.un.org/classifications/ISIC/rev4/"
target_base = "http://classif-mcp.local/unsd/isic-rev5/"
required_columns = ["ISIC Rev. 4 Code", "ISIC Rev. 5 Code"]
min_items = 600
fallback = "data/isic4-isic5.ttl"

# International trade classifications (UNSD workbooks: one sheet per version, with
# an explicit "Parent Code" column). HS 2022 is NOT here: it is published as RDF in
# Cellar (tier 1). "TOTAL" is an aggregate row, not a classification item.
# Known source anomaly: the SITC Rev. 4 sheet names divisions 09, 28 and 91 as
# parents but does not contain them; those 12 items stay at the top level, as published.
[endpoints.unsd_trade]
type = "file"
label = "UNSD trade classifications, converted live (SITC Rev. 4, BEC Rev. 5, HS 2017)"
level = "world"
provenance = "converted live from the UNSD file (not official linked data; see dct:source)"
refresh_hours = 24
uri_prefixes = ["http://classif-mcp.local/unsd/sitc", "http://classif-mcp.local/unsd/bec", "http://classif-mcp.local/unsd/hs"]

[[endpoints.unsd_trade.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/SITCCodeandDescription.xlsx"
sheet = "SITC4"
id = "sitc-rev4"
label = "SITC Rev. 4"
code_col = "Code"
label_col = "Description"
parent_col = "Parent Code"
skip_codes = "TOTAL"
required_columns = ["Code", "Description", "Parent Code"]
min_items = 3900
fallback = "data/sitc-rev4.ttl"

[[endpoints.unsd_trade.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/BECCodeandDescription.xlsx"
sheet = "BEC5"
id = "bec-rev5"
label = "BEC Rev. 5"
code_col = "Code"
label_col = "Description"
parent_col = "Parent Code"
skip_codes = "TOTAL"
required_columns = ["Code", "Description", "Parent Code"]
min_items = 170
fallback = "data/bec-rev5.ttl"

[[endpoints.unsd_trade.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/download/In%20Text/HSCodeandDescription.xlsx"
sheet = "HS17"
id = "hs2017"
label = "HS 2017"
code_col = "Code"
label_col = "Description"
parent_col = "Parent Code"
skip_codes = "TOTAL"
required_columns = ["Code", "Description", "Parent Code"]
min_items = 6500
fallback = "data/hs2017.ttl"

