# Classifications of expenditure according to purpose. COICOP 1999 is NOT here: it is
# published as RDF in Caliper (tier 1); the COICOP 2018 -> 1999 table points to
# Caliper's URIs, so the link connects. COICOP 2018 carries its explanatory notes as XKOS.
[endpoints.unsd_purpose]
type = "file"
label = "UNSD purpose classifications, converted live (COICOP 2018 with notes, COFOG, COPNI, COPP)"
level = "world"
provenance = "converted live from the UNSD file (not official linked data; see dct:source)"
refresh_hours = 168
uri_prefixes = ["http://classif-mcp.local/unsd/coicop2018", "http://classif-mcp.local/unsd/cofog",
                "http://classif-mcp.local/unsd/copni", "http://classif-mcp.local/unsd/copp"]

[[endpoints.unsd_purpose.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/COICOP_2018_English_structure.xlsx"
id = "coicop2018"
label = "COICOP 2018"
code_col = "code"
label_col = "title"
key_style = "dotted"
notes = "intro=core,includes=inclusion,alsoIncludes=additional,excludes=exclusion"
required_columns = ["code", "title", "intro", "includes", "alsoIncludes", "excludes"]
min_items = 850
fallback = "data/coicop2018.ttl"

[[endpoints.unsd_purpose.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/COICOP2018_COICOP1999_correspondence_table_final.xlsx"
mode = "correspondence"
sheet = "Correspondence 2018-1999"
id = "coicop2018-coicop1999"
label = "COICOP 2018 - COICOP 1999"
source_col = "COICOP 2018 Code"
target_col = "COICOP 1999 Code"
note_col = "Note/common content"
key_style = "dotted"
source_base = "http://classif-mcp.local/unsd/coicop2018/"
target_base = "http://unstats.un.org/classifications/COICOP/1999/"
required_columns = ["COICOP 2018 Code", "COICOP 1999 Code"]
min_items = 400
fallback = "data/coicop2018-coicop1999.ttl"

[[endpoints.unsd_purpose.sources]]
url = "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/COFOG_english_structure.txt"
id = "cofog1999"
label = "COFOG 1999"
key_style = "dotted"
min_items = 180
