# Classification endpoints served by classif-mcp.
# Add a node by adding a block. "uri_prefixes" lets the server route a
# concept URI to the endpoint that publishes it.
# Endpoint URLs are given WITHOUT a trailing slash: on both Caliper and INSEE
# the trailing-slash form serves the web query UI, not the SPARQL API.
# Verified 2026-10-23.

[endpoints.caliper]
label = "Caliper (FAO) - ISIC Rev. 4, CPC v2.0/v2.1, COICOP 1999, FAO classifications"
level = "world"
url = "https://caliper.integratedmodelling.org/caliper/sparql"
uri_prefixes = [
  "https://unstats.un.org/classifications/",
  "http://unstats.un.org/classifications/",
  "https://stats.fao.org/classifications/",
]

# UNSD classifications that are not linked data (ISIC Rev. 5, CPC Ver. 3.0,
# ISIC Rev. 4 -> Rev. 5). Converted once with `classif-unsd` (see README) and
# served in memory with the same tools. Missing files are skipped.
[endpoints.unsd]
type = "local"
label = "UNSD files converted to SKOS/XKOS (ISIC Rev. 5, CPC Ver. 3.0, ISIC Rev. 4 - Rev. 5)"
level = "world"
provenance = "converted from a UNSD file (not official linked data; see dct:source)"
files = ["data/isic-rev5.ttl", "data/cpc-v3.ttl", "data/isic4-isic5.ttl"]
uri_prefixes = ["http://classif-mcp.local/unsd/"]

[endpoints.cellar]
label = "EU Vocabularies / Cellar - Eurostat classifications (NACE, CPA, PRODCOM, CN, HS)"
level = "eu"
url = "https://publications.europa.eu/webapi/rdf/sparql"
uri_prefixes = ["http://data.europa.eu/"]

[endpoints.insee]
label = "INSEE RDF - French national classifications (NAF 2025, NAF rev. 2, CPF, ...)"
level = "national"
country = "FR"
url = "https://rdf.insee.fr/sparql"
uri_prefixes = ["http://id.insee.fr/"]
