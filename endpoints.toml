# ---------------------------------------------------------------- tier 3

# Classifications published only as PDF, transcribed with classif-pdf (see README).
# Each file's skos:note says how its transcription was checked, and by whom.
# check_source: the server compares each source PDF with the version that was
# checked, and reports any change with every answer. Missing files are skipped.
[endpoints.extracted]
type = "local"
label = "Classifications transcribed from PDF (LLM-assisted; transcription checked against the PDF)"
level = "world"
provenance = "extracted from the custodian's PDF; not endorsed by the custodian (see skos:note)"
files = ["data/ebops2010.ttl"]
check_source = true
refresh_hours = 24
uri_prefixes = ["http://classif-mcp.local/pdf/"]
